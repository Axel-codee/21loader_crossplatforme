name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./...

      - name: Build Windows amd64 installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf dist/windows release-assets-windows
          scripts/windows/build-installer.sh --version "$VERSION" --arch amd64
          mkdir -p release-assets-windows
          cp "dist/windows/21loader-${VERSION}-amd64.zip" release-assets-windows/
          cp "dist/windows/21loader-${VERSION}-amd64-setup.exe" release-assets-windows/

      - name: Upload Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: release-assets-windows/*

  macos:
    name: Build macOS package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Test
        run: go test ./...

      - name: Build macOS dmg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          rm -rf dist/macos release-assets-macos
          scripts/macos/build-dmg.sh --version "$VERSION"
          mkdir -p release-assets-macos
          cp "dist/macos/21loader-${VERSION}.dmg" release-assets-macos/

      - name: Upload macOS assets
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: release-assets-macos/*

  publish:
    name: Publish GitHub Release
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
